name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi tag rilis (contoh: v1.4.5, harus lebih besar dari versi sebelumnya)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true
          set -o pipefail
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore & Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi

          $GRADLE_CMD --version
          mkdir -p dist

          GRADLE_CI_FLAGS="--no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --stacktrace"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building Release APK using configured GitHub Secrets keystore..."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            $GRADLE_CMD :app:assembleRelease $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "Release keystore secrets not configured; building Debug APK with debug.keystore..."
            if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            $GRADLE_CMD :app:assembleDebug $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Built APK file not found!"
            exit 1
          fi

          cp "$APK_PATH" "dist/MonBer-${TAG_NAME}.apk"
          echo "Prepared artifact: dist/MonBer-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: MonBer ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          make_latest: 'true'
          prerelease: false
          files: dist/*.apk
