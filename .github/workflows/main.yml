name: Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag rilis opsional untuk publish GitHub Release (contoh: v1.4.5)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR"
          fi
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/cmdline-unpack
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Gradle Maven Central Mirror
        run: |
          cat <<'EOF' > /tmp/ci-maven-mirror.init.gradle.kts
          gradle.settingsEvaluated {
              dependencyResolutionManagement {
                  repositories {
                      val alreadyConfigured = any {
                          it is org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                              it.url.toString().contains("maven-central.storage-download.googleapis.com")
                      }
                      if (!alreadyConfigured) {
                          val mirror = maven {
                              name = "GoogleMavenCentralMirror"
                              url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                          }
                          remove(mirror)
                          val mavenIdx = indexOfFirst { it.name.contains("MavenRepo", ignoreCase = true) }
                          if (mavenIdx >= 0) {
                              add(mavenIdx, mirror)
                          } else {
                              add(mirror)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Restore Cached Debug Keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: monber-debug-keystore-v1

      - name: Prepare Keystore & Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi

          $GRADLE_CMD --version
          mkdir -p dist

          GRADLE_CI_FLAGS="--init-script /tmp/ci-maven-mirror.init.gradle.kts --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --stacktrace"

          decode_base64_to_file() {
            local b64_input="$1"
            local out_file="$2"
            B64_INPUT="$b64_input" python3 - "$out_file" <<'PY'
          import base64, os, re, sys

          raw = os.environ.get("B64_INPUT", "").strip()
          cleaned = re.sub(r'[\s"\']+', '', raw)
          if not cleaned:
              sys.exit(1)
          cleaned = cleaned.replace('-', '+').replace('_', '/')
          pad = (-len(cleaned)) % 4
          if pad:
              cleaned += '=' * pad
          try:
              data = base64.b64decode(cleaned, validate=False)
          except Exception:
              sys.exit(1)
          if not data:
              sys.exit(1)
          with open(sys.argv[1], 'wb') as f:
              f.write(data)
          PY
          }

          validate_debug_keystore() {
            local ks_file="$1"
            [ -s "$ks_file" ] && keytool -list -keystore "$ks_file" -storepass android -alias androiddebugkey >/dev/null 2>&1
          }

          REF_FULL="${{ github.ref }}"
          if [[ "$REF_FULL" == refs/tags/* ]]; then
            RELEASE_TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            VER_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.0.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi
          echo "Resolved RELEASE_TAG=$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          RELEASE_KS_TRIMMED=$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]')
          if [ -n "$RELEASE_KS_TRIMMED" ]; then
            if [ -z "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
              export STORE_PASSWORD="$KEY_PASSWORD"
            fi
            if [ -z "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
              export KEY_PASSWORD="$STORE_PASSWORD"
            fi
            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Error: RELEASE_KEYSTORE_BASE64 is configured, but STORE_PASSWORD / KEY_PASSWORD is missing!"
              exit 1
            fi

            echo "Building Release APK using configured GitHub Secrets keystore..."
            if ! decode_base64_to_file "$RELEASE_KEYSTORE_BASE64" "my-upload-key.jks"; then
              echo "Error: Failed to decode RELEASE_KEYSTORE_BASE64 into my-upload-key.jks!"
              exit 1
            fi

            if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "Error: my-upload-key.jks could not be opened with STORE_PASSWORD!"
              exit 1
            fi

            if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              DETECTED_ALIASES=$(keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F',' '/PrivateKeyEntry/{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}')
              ALIAS_COUNT=$(printf '%s\n' "$DETECTED_ALIASES" | grep -c . || true)
              if [ "$ALIAS_COUNT" -eq 1 ]; then
                SINGLE_ALIAS=$(printf '%s\n' "$DETECTED_ALIASES" | head -n 1)
                echo "::warning::Alias 'upload' not found in my-upload-key.jks; mapping alias '$SINGLE_ALIAS' -> 'upload' for build."
                keytool -changealias -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias "$SINGLE_ALIAS" -destalias upload -keypass "$KEY_PASSWORD"
              else
                echo "Error: Key alias 'upload' not found in my-upload-key.jks (found aliases: $DETECTED_ALIASES)."
                exit 1
              fi
            fi

            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            $GRADLE_CMD :app:assembleRelease $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            if [ -n "$STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ]; then
              echo "::warning::STORE_PASSWORD or KEY_PASSWORD is set without RELEASE_KEYSTORE_BASE64; falling back to Debug APK keystore."
            else
              echo "Release keystore secrets not configured; preparing Debug APK keystore..."
            fi

            DEBUG_READY=0
            if [ -n "$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')" ]; then
              echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 GitHub Secret..."
              if decode_base64_to_file "$DEBUG_KEYSTORE_BASE64" "debug.keystore.tmp" && validate_debug_keystore "debug.keystore.tmp"; then
                mv -f debug.keystore.tmp debug.keystore
                DEBUG_READY=1
              else
                rm -f debug.keystore.tmp
                echo "::warning::DEBUG_KEYSTORE_BASE64 is invalid or does not match android/androiddebugkey; falling back."
              fi
            fi

            if [ "$DEBUG_READY" -eq 0 ] && [ -s "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from repository debug.keystore.base64..."
              if decode_base64_to_file "$(cat debug.keystore.base64)" "debug.keystore.tmp" && validate_debug_keystore "debug.keystore.tmp"; then
                mv -f debug.keystore.tmp debug.keystore
                DEBUG_READY=1
              else
                rm -f debug.keystore.tmp
                echo "::warning::Repository debug.keystore.base64 failed validation."
              fi
            fi

            if [ "$DEBUG_READY" -eq 0 ] && validate_debug_keystore "debug.keystore"; then
              echo "::warning::Using cached debug.keystore. Add DEBUG_KEYSTORE_BASE64 to GitHub Secrets for permanent consistent signing."
              DEBUG_READY=1
            fi

            if [ "$DEBUG_READY" -eq 0 ]; then
              rm -f debug.keystore
              echo "::warning::Generating fresh debug.keystore (will be cached across runs). Add DEBUG_KEYSTORE_BASE64 to GitHub Secrets for permanent consistent signing."
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi

            if ! validate_debug_keystore "debug.keystore"; then
              echo "Error: debug.keystore is missing, empty, or invalid!"
              exit 1
            fi

            echo "Active debug.keystore certificate info:"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias name|Owner|Valid from|SHA256" || true
            $GRADLE_CMD :app:assembleDebug $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Built APK file not found!"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature with $APKSIGNER..."
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi

          cp "$APK_PATH" "dist/MonBer-${RELEASE_TAG}.apk"
          echo "Prepared artifact: dist/MonBer-${RELEASE_TAG}.apk"

      - name: Run Unit Tests
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi
          TEST_FLAGS="--init-script /tmp/ci-maven-mirror.init.gradle.kts --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
          for attempt in 1 2 3; do
            echo "Running unit tests (attempt $attempt/3)..."
            if $GRADLE_CMD :app:testDebugUnitTest $TEST_FLAGS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Unit test attempt $attempt failed; waiting 15s before retry..."
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monber-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: MonBer ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: 'true'
          prerelease: false
          overwrite_files: true
          files: dist/*.apk
