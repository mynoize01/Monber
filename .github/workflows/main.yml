name: Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag rilis opsional untuk publish GitHub Release (contoh: v1.4.5)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR"
          fi
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/cmdline-unpack
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore & Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi

          $GRADLE_CMD --version
          mkdir -p dist

          GRADLE_CI_FLAGS="--no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --stacktrace"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              RELEASE_TAG="$INPUT_TAG"
            else
              VER_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
              RELEASE_TAG="v${VER_NAME}"
            fi
          else
            RELEASE_TAG="$REF_NAME"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building Release APK using configured GitHub Secrets keystore..."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            $GRADLE_CMD :app:assembleRelease $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "Release keystore secrets not configured; building Debug APK with debug.keystore..."
            if [ ! -s "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            if [ ! -s "debug.keystore" ]; then
              echo "debug.keystore.base64 not found in repo; generating debug.keystore via keytool..."
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            $GRADLE_CMD :app:assembleDebug $GRADLE_CI_FLAGS
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Built APK file not found!"
            exit 1
          fi

          cp "$APK_PATH" "dist/MonBer-${RELEASE_TAG}.apk"
          echo "Prepared artifact: dist/MonBer-${RELEASE_TAG}.apk"

      - name: Run Unit Tests
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi
          $GRADLE_CMD :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monber-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MonBer ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: 'true'
          prerelease: false
          files: dist/*.apk
